<svg xmlns="http://www.w3.org/2000/svg" width="800" height="270" viewBox="0 0 800 270" role="img" aria-label="Animated terminal typing out a short intro" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
text{font-family:SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;font-size:16px}
.p{fill:#a6e3a1} .c{fill:#cdd6f4} .o{fill:#89b4fa}
.hide{opacity:0;animation:show .01s forwards}
@keyframes show{to{opacity:1}}
.cur{animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
#r0{animation:ty0 0.42s steps(6) 0.6s forwards}@keyframes ty0{to{width:57.6px}}
#r1{animation:ty1 0.77s steps(11) 2.4s forwards}@keyframes ty1{to{width:105.6px}}
</style>
<rect x="1" y="1" width="798" height="268" rx="12" fill="#1e1e2e" stroke="#45475a" stroke-width="1.5"/>
<path d="M1 13a12 12 0 0 1 12-12h774a12 12 0 0 1 12 12v23H1z" fill="#2a2b3d"/>
<circle cx="24" cy="19" r="6.5" fill="#ff5f56"/><circle cx="46" cy="19" r="6.5" fill="#ffbd2e"/><circle cx="68" cy="19" r="6.5" fill="#27c93f"/>
<text x="400" y="24" text-anchor="middle" style="font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px" fill="#8a8fa3">robin -- zsh -- 80x24</text>
<g>
<clipPath id="k0"><rect id="r0" x="43" y="66" width="0" height="26"/></clipPath>
<text class="p hide" x="24" y="84" style="animation-delay:0.6s">$</text>
<text class="c" x="43.2" y="84" clip-path="url(#k0)" xml:space="preserve">whoami</text>
<text class="o hide" x="24" y="112" style="animation-delay:1.4s">Robin</text>
<clipPath id="k1"><rect id="r1" x="43" y="134" width="0" height="26"/></clipPath>
<text class="p hide" x="24" y="152" style="animation-delay:2.4s">$</text>
<text class="c" x="43.2" y="152" clip-path="url(#k1)" xml:space="preserve">cat project</text>
<text class="o hide" x="24" y="180" style="animation-delay:3.5s">Offtrack</text>
<text class="p hide" x="24" y="220" style="animation-delay:4.6s">$</text>
<g class="hide" style="animation-delay:4.6s"><rect class="cur" x="43" y="205" width="9" height="19" fill="#cdd6f4"/></g>
</g>
</svg>